name: book

# The pipeline is the only path to a published book. Nothing here is a step
# somebody could skip by building on their laptop instead.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # WeasyPrint renders the PDF and needs Pango at the system level — it is
      # not a Python dependency, so pip cannot supply it.
      - name: Install PDF system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libfribidi0

      - name: Install bookkit
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
          pip install "content-kit-core @ git+https://github.com/alpibrusl/content-kit@main#subdirectory=packages/core"
          pip install "bookkit[epub,pdf] @ git+https://github.com/alpibrusl/content-kit@main#subdirectory=packages/bookkit"

      # The gate. A term used before it is defined fails the build, the same
      # way a failing test would.
      - name: Check term continuity
        run: make check

      - name: Build EPUB
        run: make epub

      - name: Build HTML
        run: make html

      - name: Build PDF
        run: make pdf

      # Cheap, needs no TTS backend, and catches the audio source breaking —
      # which is how the exit-code bug in `audiobook-plan` reached main.
      - name: Generate the audiobook project
        run: |
          make audiobook-plan
          make audiobook

      - uses: actions/upload-artifact@v4
        with:
          name: prompt-to-production
          path: build/

  cohort:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cohortkit
        run: |
          python -m pip install --upgrade pip
          pip install "content-kit-core @ git+https://github.com/alpibrusl/content-kit@main#subdirectory=packages/core"
          pip install "cohortkit @ git+https://github.com/alpibrusl/cohort-kit@main"

      # Cross-checks every session's chapter list against this book's own
      # book.yaml -- a chapter renumbered in the manuscript and never
      # updated in the curriculum fails here, not silently.
      - name: Check the cohort curriculum
        run: make cohort-check

      - name: Build the student handout and facilitator guide
        run: make cohort-build

      - uses: actions/upload-artifact@v4
        with:
          name: prompt-to-production-cohort
          path: cohort/build/
