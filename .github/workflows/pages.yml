# SPDX-License-Identifier: EUPL-1.2

name: pages

# Publishes the book as a proper web reader (not bookkit's print-emulating
# HTML — see site/build_reader.py) alongside the cohort student handout, at
# a stable URL. That stability matters for the handout specifically: its
# progress tracking lives in the browser's own localStorage, keyed to this
# page, so a student needs to reopen the same URL — not a fresh file each
# session — for their checked-off progress to still be there.
#
# The facilitator guide is never published here. It's the one artifact
# whose whole reason to exist is content the handout deliberately omits.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# The toolchain is pinned so this book's own tag is enough to rebuild it.
# Bumping is deliberate: change this, rebuild, and check the build stamp
# on the copyright page reads what you expect.
env:
  TOOLCHAIN: v0.2.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cohortkit
        run: |
          python -m pip install --upgrade pip
          pip install "content-kit-core @ git+https://github.com/alpibrusl/content-kit@${{ env.TOOLCHAIN }}#subdirectory=packages/core"
          pip install "cohortkit @ git+https://github.com/alpibrusl/cohort-kit@${{ env.TOOLCHAIN }}"

      - name: Build the student handout
        run: make cohort-build

      - name: Build the web reader
        run: python3 site/build_reader.py

      - name: Assemble the Pages site
        run: |
          mkdir -p _site
          cp site/index.html _site/index.html
          cp cohort/build/handout.html _site/handout.html

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
