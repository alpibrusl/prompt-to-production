# SPDX-License-Identifier: EUPL-1.2

name: release

# Tagging is how a book gets published. The tag is the whole input: the
# toolchain below is pinned and the manuscript is in the commit, so this
# job rebuilds the book from the tag rather than shipping a binary somebody
# built elsewhere. `book` already proves every push builds; this proves the
# tagged commit builds, and attaches what it built.
#
# EPUB and PDF only. `make html` produces a single 1.3 MB file that a
# browser downloads rather than renders, so as a release asset it is a
# worse version of the PDF. If the HTML edition is ever worth publishing,
# it wants a URL to be read at, not a download.

on:
  push:
    tags: ["v*"]

# To create the release and upload its assets.
permissions:
  contents: write

# Pinned for the same reason as in `book`: this book's own tag has to be
# enough to rebuild it. Keep the two in step.
env:
  TOOLCHAIN: v0.2.0

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # WeasyPrint renders the PDF and needs Pango at the system level — it is
      # not a Python dependency, so pip cannot supply it.
      - name: Install PDF system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libfribidi0

      - name: Install bookkit
        run: |
          python -m pip install --upgrade pip
          pip install "content-kit-core @ git+https://github.com/alpibrusl/content-kit@${{ env.TOOLCHAIN }}#subdirectory=packages/core"
          pip install "bookkit[epub,pdf] @ git+https://github.com/alpibrusl/content-kit@${{ env.TOOLCHAIN }}#subdirectory=packages/bookkit"

      # The same gate `book` applies. A tag is not a way around it: a term
      # used before it is defined fails the release too.
      - name: Check term continuity
        run: make check

      - name: Build EPUB
        run: make epub

      - name: Build PDF
        run: make pdf

      # Globs, not filenames, so this file is identical in all four book
      # repositories — the slug lives in book.yaml and nowhere else.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -lh build/*.epub build/*.pdf
          gh release create "${{ github.ref_name }}" \
            build/*.epub build/*.pdf \
            --title "${{ github.ref_name }}" \
            --generate-notes
