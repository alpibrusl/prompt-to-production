  # may legitimately reference terms the chapters go on to define.
  - { file: chapters/00-a-note-from-the-author.md, title: "" }
  # Part I — The Ground
  - { file: chapters/01-the-handoff.md,        title: "" }
  - { file: chapters/02-where-code-lives.md,   title: "" }
  - { file: chapters/03-the-shape-of-an-app.md, title: "" }
  # Part II — Keeping It
  - { file: chapters/04-version-control.md,    title: "" }
  - { file: chapters/05-environments.md,       title: "" }
  - { file: chapters/06-tests.md,              title: "" }
  # Part III — Shipping It
  - { file: chapters/07-infrastructure.md,     title: "" }
  - { file: chapters/08-infrastructure-as-code.md, title: "" }
  - { file: chapters/09-ci-cd.md,              title: "" }
  # Part IV — Living With It
  - { file: chapters/10-observability.md,      title: "" }
  - { file: chapters/11-when-it-breaks.md,     title: "" }
  - { file: chapters/12-security.md,           title: "" }
  - { file: chapters/13-cost.md,               title: "" }
  # Part V — Working With the Agent
  - { file: chapters/14-directing-the-work.md, title: "" }
  - { file: chapters/15-the-minimum-bar.md,    title: "" }

front_matter: [title_page, copyright, toc]

back_matter:
  # Generated from glossary.yaml by `make glossary` — do not edit by hand.
  - { file: GLOSSARY.md, title: "Glossary" }
