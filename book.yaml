title: "Prompt to Production"
subtitle: "The software engineering your AI agent assumes you already know"
cover: "cover.png"
author:
  name: "Alfonso Sastre"
  bio: >-
    Alfonso Sastre is a theoretical physicist by training. His PhD and four
    years of postdoctoral research were in lattice QCD, a field where the
    physics comes out of large-scale simulation — which meant writing
    high-performance code and analysing the data it produced. Since 2015 he has
    worked as a data scientist in travel, banking and electric mobility.
language: en
output: "prompt-to-production.epub"

copyright:
  year: "2026"
  license: "CC BY-NC 4.0"
  license_url: "https://creativecommons.org/licenses/by-nc/4.0/"
  notice:
    - >-
      Written with the assistance of an AI agent, which is the only honest way
      to write this particular book. Every claim in it is the author's to defend.

theme:
  base_font: serif
  page_size: 6x9
  font_size_pt: 11.0
  stylesheet: "style.css"
  stylesheet_mode: extend

chapters:
  # `title` overrides each chapter's own H1 for the rendered heading and TOC
  # entry — used here to prefix "Chapter N", because the manuscript refers to
  # chapters by number constantly and, without this, that number appears
  # nowhere a reader can see: not in the heading, not in the table of
  # contents. The Markdown source keeps its own plain H1; the numbering is
  # book-assembly metadata, so it lives here rather than in the prose.
  # Part I — The Ground
  - { file: chapters/01-the-handoff.md,        title: "Chapter 1 — The Handoff", part: "Part I — The Ground" }
  - { file: chapters/02-where-code-lives.md,   title: "Chapter 2 — Where Code Lives" }
  - { file: chapters/03-the-shape-of-an-app.md, title: "Chapter 3 — The Shape of an App" }
  # Part II — Keeping It
  - { file: chapters/04-version-control.md,    title: "Chapter 4 — Keeping Every Version", part: "Part II — Keeping It" }
  - { file: chapters/05-environments.md,       title: "Chapter 5 — Environments and Secrets" }
  - { file: chapters/06-tests.md,              title: "Chapter 6 — The Question You Ask Automatically" }
  # Part III — Shipping It
  - { file: chapters/07-infrastructure.md,     title: "Chapter 7 — What You Are Actually Renting", part: "Part III — Shipping It" }
  - { file: chapters/08-infrastructure-as-code.md, title: "Chapter 8 — Writing the Setup Down" }
  - { file: chapters/09-ci-cd.md,              title: "Chapter 9 — The Path to Production" }
  # Part IV — Living With It
  - { file: chapters/10-observability.md,      title: "Chapter 10 — Knowing What It Is Doing", part: "Part IV — Living With It" }
  - { file: chapters/11-when-it-breaks.md,     title: "Chapter 11 — The Night It Breaks" }
  - { file: chapters/12-security.md,           title: "Chapter 12 — Who Is Allowed to Do This" }
  - { file: chapters/13-cost.md,               title: "Chapter 13 — The Bill You Didn't See Coming" }
  # Part V — Working With the Agent
  - { file: chapters/14-directing-the-work.md, title: "Chapter 14 — Directing the Work", part: "Part V — Working With the Agent" }
  - { file: chapters/15-you-are-the-single-point-of-failure.md, title: "Chapter 15 — You Are the Single Point of Failure" }
  - { file: chapters/16-the-minimum-bar.md,    title: "Chapter 16 — The Minimum Bar" }
  # Afterword. Was chapter 0 (front matter); moved here deliberately.
  # See "The afterword is a real chapter, not front matter" in CLAUDE.md.
  # Deliberately left unnumbered, unlike the 16 above — an afterword
  # conventionally isn't part of the numbered sequence, and the "Afterword"
  # tag inside the chapter itself already marks it as set apart.
  - { file: chapters/17-a-note-from-the-author.md, title: "" }

front_matter:
  - title_page
  - copyright
  # The series map opens the book. A reader meets "the second book in this
  # series" in chapter 1; the page that explains what that is has to come
  # before it, not 150 pages later in the back matter.
  - { file: ABOUT-THE-SERIES.md, title: "The Prompt to... Series" }
  - toc

back_matter:
  # Generated from glossary.yaml by `make glossary` — do not edit by hand.
  - { file: GLOSSARY.md, title: "Glossary" }
  - about_author
  - { file: COLOPHON.md, title: "Colophon" }
