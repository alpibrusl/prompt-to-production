title: "Production Bootcamp Pilot"
subtitle: "A test run at turning Prompt to Production into a taught module — eight sessions, one running fixture, one capstone that produces a real, honest audit instead of a grade."
book: "prompt-to-production"
book_title: "Prompt to Production"
session_count: 8
session_length_hours: 2
cohort_size_min: 8
cohort_size_max: 15
format: "live, synchronous"
prerequisite: >-
  An agent that can load a SKILL.md file (Claude Code or equivalent), for the
  capstone in Session 8. The fixture path needs nothing beyond that -- no
  repository access, no credentials, no approvals -- which is what makes it
  the workable default where an agent cannot be pointed at company systems.
sessions_file: "sessions.yaml"
rubric_file: "rubric.yaml"
